# See https://documentation.ubuntu.com/rockcraft/1.19.2/reference/extensions/django-framework
# For questions or help, visit https://matrix.to/#/#12-factor-charms:ubuntu.com

name: cms
# see https://documentation.ubuntu.com/rockcraft/1.19.2/explanation/bases/
# for more information about bases and using 'bare' bases for chiselled rocks
base: bare # as an alternative, an ubuntu base can be used
build-base: ubuntu@24.04 # build-base is required when the base is bare
version: "0.1" # just for humans. Semantic versioning is recommended
summary: Admin area and API for managing Canonical Partners data
description: |
  This is the Django application behind partners.ubuntu.com. It provides
  an admin area for managing Partners data and a public API endpoint for
  serving partner information as JSON.
# the platforms this rock should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
platforms:
  amd64:
  # arm64:
  # ppc64el:
  # s390x:

# to ensure the django-framework extension functions properly, your Django project
# should have a structure similar to the following with ./cms/cms/wsgi.py
# being the WSGI entry point and contain an application object.
# +-- cms
# |   |-- cms
# |   |   |-- wsgi.py
# |   |   +-- ...
# |   |-- manage.py
# |   |-- migrate.sh
# |   +-- some_app
# |       |-- views.py
# |       +-- ...
# |-- requirements.txt
# +-- rockcraft.yaml

extensions:
  - django-framework
# uncomment the sections you need and adjust according to your requirements.
# parts:
#   django-framework/dependencies:
#     stage-packages:
#       # list required packages or slices for your Django application below.
#       - libpq-dev

# The django-framework extension packs the whole `cms/` directory into
# /django/app. Redeclaring install-app makes the extension defer to this part
# entirely, so the default `-django/app/db.sqlite3` exclusion is restated here
# alongside the local artefacts we don't want in a production image.
parts:
  django-framework/install-app:
    plugin: dump
    source: cms
    organize:
      "*": django/app/
      ".*": django/app/
    stage:
      - -django/app/db.sqlite3
      - -django/app/development.sqlite
      - -django/app/django-error.log
      - -django/app/tests
      # Stale repo-checked admin assets; collectstatic regenerates these (below).
      - -django/app/static

  # Bake Django static into the image for WhiteNoise. Done at build (not a
  # service-command override, which sends the charm to `blocked`).
  django-framework/dependencies:
    override-build: |
      craftctl default
      # craftctl default dismantles the venv; point PYTHONPATH at the staged site-packages so collectstatic can import Django.
      DJANGO_PKG="$(find "${CRAFT_PART_INSTALL}" -type d -name django -path '*/site-packages/*' | head -1)"
      SITE_PACKAGES="$(dirname "${DJANGO_PKG}")"
      PYBIN="$(ls "${CRAFT_PART_INSTALL}"/bin/python3* 2>/dev/null | head -1)"
      [ -x "${PYBIN}" ] || PYBIN=python3
      mkdir -p "${CRAFT_PART_INSTALL}/django/app/static"
      SECRET_KEY=build-only \
      DATABASE_URL=sqlite:///tmp/collectstatic-build.sqlite3 \
      DJANGO_STATIC_ROOT="${CRAFT_PART_INSTALL}/django/app/static" \
      PYTHONPATH="${SITE_PACKAGES}" \
        "${PYBIN}" "${CRAFT_PART_SRC}/cms/manage.py" collectstatic --noinput --clear
